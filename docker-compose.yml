# All configuration is read from the single .env file in this directory.
#
#   docker compose up -d db      # PostgreSQL only; run the backend locally with `npm run dev`
#   docker compose up --build    # the whole stack in containers
services:
  db:
    image: postgres:17-alpine
    container_name: solugen-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the companion <POSTGRES_DB>_test database used by the Jest suite.
      # Runs only on first initialisation of an empty volume.
      - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solugen-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # The only value that differs between running locally and running in Compose:
      # inside this network the database is reachable as `db`, not `localhost`.
      # Overriding it here is what lets a single .env serve both modes.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    ports:
      - '${PORT:-4000}:${PORT:-4000}'

volumes:
  postgres_data:
